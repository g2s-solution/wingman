name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: wingman/server/package-lock.json
      - name: Quality gate
        run: ./scripts/check_quality.sh

  # The plugin still supports Node 22 (engines in package.json, esbuild target node22): run the tests on it too.
  node22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wingman/server/package-lock.json
      - name: Tests on the minimum supported Node
        working-directory: wingman/server
        run: npm ci && npm test

  # Run supervision uses `ps` on macOS instead of /proc: run the tests there too.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: wingman/server/package-lock.json
      - name: Tests on macOS
        working-directory: wingman/server
        run: npm ci && npm test
